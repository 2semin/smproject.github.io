<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>국어 퀴즈 문제</title>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
    }
    td {
      width: 60px;
      height: 60px;
      border: 2px solid #333;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    td.selected {
      background-color: #ffe066;
      color: #d9480f;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    .result-box {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    /* 2페이지 문제 스타일 */
    .quiz-container {
      max-width: 450px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.8;
    }
    .question-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f9f9f9;
    }
    .question-box input {
      width: 60px;
      padding: 5px;
      font-size: 16px;
      text-align: center;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <!-- ================= 1페이지: '텝' 찾기 ================= -->
  <div id="page1">
    <h2>1단계: 다음 중에서 '텝'을 모두 찾아보세요.</h2>

    <table id="wordTable">
      <tr>
        <td>탭</td><td>텝</td><td>팁</td><td>톱</td>
      </tr>
      <tr>
        <td>텁</td><td>탑</td><td>텝</td><td>탭</td>
      </tr>
      <tr>
        <td>텝</td><td>팁</td><td>탭</td><td>텝</td>
      </tr>
    </table>

    <button onclick="checkResult()">선택 완료</button>
    <!-- 처음엔 숨겨져 있다가 1단계 통과 시 나타남 -->
    <button id="nextBtn" onclick="goNextPage()" style="display: none;">다음 페이지로 ➡</button>
    <div id="result1" class="result-box"></div>
  </div>

  <!-- ================= 2페이지: 빈칸 채우기 문제 ================= -->
  <div id="page2" style="display: none;">
    <h2>2단계: 알맞은 선택지 번호를 입력하세요.</h2>

    <div class="quiz-container">
      <!-- 1번 문제 -->
      <div class="question-box">
        <strong>1. 바람이 ____.</strong><br>
        1. 떠오른다 2. 나타난다  3. 분다<br>
        정답 입력: <input type="number" id="ans1" min="1" max="3"> 번
      </div>

      <!-- 2번 문제 -->
      <div class="question-box">
        <strong>2. 단풍은 ____에 볼 수 있다.</strong><br>
        1. 가을  2. 겨울  3. 바위<br>
        정답 입력: <input type="number" id="ans2" min="1" max="3"> 번
      </div>

      <!-- 3번 문제 -->
      <div class="question-box">
        <strong>3. 종이가 ____.</strong><br>
        1. 바쁘다  2. 깨끗하다 3. 회복되다<br>
        정답 입력: <input type="number" id="ans3" min="1" max="3"> 번
      </div>
    </div>

    <button onclick="gradeQuiz()">정답 제출</button>
    <div id="result2" class="result-box"></div>
  </div>

  <script>
    // --- 1페이지 로직 ---
    const cells = document.querySelectorAll('#wordTable td');

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        cell.classList.toggle('selected');
      });
    });

    function checkResult() {
      const selectedCells = document.querySelectorAll('#wordTable td.selected');
      const resultDiv = document.getElementById('result1');
      const nextBtn = document.getElementById('nextBtn');
      let tepCount = 0;
      let hasWrong = false;

      selectedCells.forEach(cell => {
        if (cell.textContent.trim() === '텝') {
          tepCount++;
        } else {
          hasWrong = true;
        }
      });

      if (hasWrong) {
        resultDiv.style.color = '#e03131';
        resultDiv.textContent = "'텝'이 아닌 다른 글자가 선택되었습니다. 다시 선택해 주세요!";
        nextBtn.style.display = 'none'; // 오답이 있으면 다음 버튼 숨김
      } else if (tepCount === 0) {
        resultDiv.style.color = '#e03131';
        resultDiv.textContent = "글자를 선택해 주세요!";
        nextBtn.style.display = 'none';
      } else {
        resultDiv.style.color = '#1971c2';
        resultDiv.textContent = `찾은 '텝'의 개수: ${tepCount}개`;
        nextBtn.style.display = 'inline-block'; // 정상 선택 시 '다음 페이지로' 버튼 표시
      }
    }

    // 다음 페이지로 화면 전환
    function goNextPage() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';
    }

    // --- 2페이지 채점 로직 ---
    function gradeQuiz() {
      // 실제 정답 설정 (1번: 3번 분다, 2번: 1번 가을, 3번: 2번 깨끗하다)
      const correctAnswers = ['3', '1', '2'];
      
      // 사용자가 입력한 값 가져오기
      const userAnswers = [
        document.getElementById('ans1').value.trim(),
        document.getElementById('ans2').value.trim(),
        document.getElementById('ans3').value.trim()
      ];

      let correctCount = 0;
      let wrongNumbers = [];

      for (let i = 0; i < correctAnswers.length; i++) {
        if (userAnswers[i] === correctAnswers[i]) {
          correctCount++;
        } else {
          wrongNumbers.push(`${i + 1}번`); // 틀린 문제 번호 기록
        }
      }

      const resultDiv = document.getElementById('result2');
      resultDiv.style.color = '#1971c2';

      if (wrongNumbers.length === 0) {
        resultDiv.textContent = `정답 개수: ${correctCount}개 (모두 맞혔습니다!)`;
      } else {
        resultDiv.textContent = `정답 개수: ${correctCount}개 / 틀린 문제: ${wrongNumbers.join(', ')}`;
      }
    }
  </script>

</body>
</html>
